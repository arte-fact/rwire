[package]
name = "rwire-markdown"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Markdown rendering to rwire element trees, with table-driven code highlighting"
keywords = ["web", "markdown", "ui"]
categories = ["web-programming"]

[dependencies]
rwire = { path = "../rwire", version = "0.1.0", default-features = false }
pulldown-cmark = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

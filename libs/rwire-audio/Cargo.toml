[package]
name = "rwire-audio"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Microphone capture and gapless playback for rwire: a dedicated audio socket, its runtime extension and builder helpers"
keywords = ["web", "ui", "audio", "voice", "websocket"]
categories = ["web-programming", "multimedia::audio"]

[dependencies]
rwire = { path = "../rwire", version = "0.1.0", default-features = false }
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "test-util"] }
